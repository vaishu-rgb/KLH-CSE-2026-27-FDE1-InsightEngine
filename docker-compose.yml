version: "3.9"

x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  image: insightengine/airflow:latest
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_AIRFLOW_USER}:${POSTGRES_AIRFLOW_PASSWORD}@postgres-airflow:5432/${POSTGRES_AIRFLOW_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # connection strings passed to DAGs
    RAW_DB_CONN: postgresql+psycopg2://${POSTGRES_RAW_USER}:${POSTGRES_RAW_PASSWORD}@postgres-raw:5432/${POSTGRES_RAW_DB}
    DW_DB_CONN: postgresql+psycopg2://${POSTGRES_DW_USER}:${POSTGRES_DW_PASSWORD}@postgres-dw:5432/${POSTGRES_DW_DB}
    KAFKA_BROKER: kafka:9092
    SPARK_LOCAL_IP: 127.0.0.1
    PYTHONPATH: /opt/airflow/project
    PROJECT_ROOT: /opt/airflow/project
    # Override .env vars for in-container use (Docker network names)
    RAW_DB_HOST: postgres-raw
    DW_DB_HOST: postgres-dw
    POSTGRES_RAW_PORT: "5432"
    POSTGRES_DW_PORT: "5432"
    KAFKA_HOST_BROKER: kafka:9092
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./:/opt/airflow/project
  depends_on:
    postgres-airflow:
      condition: service_healthy
  user: "${AIRFLOW_UID:-50000}:0"

services:

  # ---------- Postgres: RAW layer ----------
  postgres-raw:
    image: postgres:16
    container_name: ie_postgres_raw
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_RAW_USER}
      POSTGRES_PASSWORD: ${POSTGRES_RAW_PASSWORD}
      POSTGRES_DB: ${POSTGRES_RAW_DB}
    ports:
      - "${POSTGRES_RAW_PORT}:5432"
    volumes:
      - postgres_raw_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_RAW_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Postgres: WAREHOUSE layer ----------
  postgres-dw:
    image: postgres:16
    container_name: ie_postgres_dw
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_DW_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DW_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DW_DB}
    ports:
      - "${POSTGRES_DW_PORT}:5432"
    volumes:
      - postgres_dw_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DW_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Postgres: AIRFLOW metadata ----------
  postgres-airflow:
    image: postgres:16
    container_name: ie_postgres_airflow
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_AIRFLOW_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AIRFLOW_PASSWORD}
      POSTGRES_DB: ${POSTGRES_AIRFLOW_DB}
    ports:
      - "${POSTGRES_AIRFLOW_PORT}:5432"
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AIRFLOW_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Kafka (KRaft mode, no Zookeeper) ----------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: ie_kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ---------- Spark: master ----------
  spark:
    image: apache/spark:3.5.1-python3
    container_name: ie_spark
    restart: unless-stopped
    user: root
    environment:
      - SPARK_NO_DAEMONIZE=true
    command: /opt/spark/sbin/start-master.sh
    ports:
      - "8081:8080"
      - "7077:7077"
    volumes:
      - ./:/opt/insightengine

  # ---------- Spark: worker ----------
  spark-worker:
    image: apache/spark:3.5.1-python3
    container_name: ie_spark_worker
    restart: unless-stopped
    user: root
    environment:
      - SPARK_NO_DAEMONIZE=true
    command: /opt/spark/sbin/start-worker.sh spark://spark:7077
    depends_on:
      - spark
    volumes:
      - ./:/opt/insightengine

  # ---------- Airflow: init (runs once) ----------
  airflow-init:
    <<: *airflow-common
    container_name: ie_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin
        echo "Airflow init complete."

  # ---------- Airflow: webserver ----------
  airflow-webserver:
    <<: *airflow-common
    container_name: ie_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ---------- Airflow: scheduler ----------
  airflow-scheduler:
    <<: *airflow-common
    container_name: ie_airflow_scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_raw_data:
  postgres_dw_data:
  postgres_airflow_data:
  kafka_data: